[project]
name = "python-monitoring-agent"
version = "0.1.0"
description = "A prototype Docker container health monitoring agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docker>=7.1.0",
    "graypy>=2.1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
monitoring-agent = "monitoring_agent.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitoring_agent"]
