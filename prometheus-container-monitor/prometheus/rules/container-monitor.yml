groups:
  - name: container-monitor
    rules:
      - alert: ContainerLogCheckCritical
        expr: container_log_check_status == 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container log check failed"
          description: >-
            {{ $labels.container }} failed {{ $labels.rule }} in
            {{ $labels.env }} on {{ $labels.instance }}.

      - alert: ContainerLogCheckUnknown
        expr: container_log_check_status == 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container log check is unknown"
          description: >-
            {{ $labels.container }} returned UNKNOWN for {{ $labels.rule }} in
            {{ $labels.env }} on {{ $labels.instance }}.

      - alert: ContainerLogCheckStale
        expr: time() - container_log_check_last_run_timestamp_seconds > 32400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container log check is stale"
          description: >-
            No fresh {{ $labels.rule }} result has been received for
            {{ $labels.container }} in {{ $labels.env }} on {{ $labels.instance }}.
