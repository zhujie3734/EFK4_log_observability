global:
  resolve_timeout: 5m

route:
  receiver: container-monitor-slack
  group_by: [alertname, env, instance, container, rule]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: container-monitor-slack
    slack_configs:
      - api_url: https://hooks.slack.com/services/REPLACE_WITH_LOCAL_WEBHOOK
        channel: "#replace-with-channel"
        send_resolved: true
        message_text: |-
          [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
          {{ range .Alerts }}
          Environment: {{ .Labels.env }}
          Host: {{ .Labels.instance }}
          Container: {{ .Labels.container }}
          Rule: {{ .Labels.rule }}
          Severity: {{ .Labels.severity }}
          Summary: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          {{ end }}
